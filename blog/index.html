<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1a3a">
<title>SearchMania Inc. ブログ</title>
<meta name="description" content="SearchMania Inc. からのお知らせ・最新情報">
<meta http-equiv="content-language" content="ja">

<meta property="og:type" content="article">
<meta property="og:site_name" content="SearchMania Inc.">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://search-mania.net/ogp.svg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="https://res.cloudinary.com/dgs6qz3bd/image/upload/v1762307524/SearchMania%E3%83%AD%E3%82%B4_%E9%BB%92_hxaeuk.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#ffffff;
  color:#0f172a;
  font-family:'Inter','Noto Sans JP',sans-serif;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
header{
  background:#0a1a3a;
  padding:18px 20px;
  text-align:center;
  border-bottom:1px solid rgba(66,133,244,.2);
  position:sticky;top:0;z-index:10;
}
header a{
  color:#ffffff;
  text-decoration:none;
  font-size:17px;
  letter-spacing:.18em;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:10px;
}
header a img{ height:28px; filter:brightness(0) invert(1); }
.wrap{
  max-width:760px;
  margin:60px auto;
  padding:0 24px 80px;
}
.loading{
  text-align:center;padding:120px 0;
  color:#64748b;font-size:13px;letter-spacing:.2em;
}
.loading::after{
  content:'読 み 込 み 中 …';
  display:block;animation:fade 1.4s ease-in-out infinite;
}
@keyframes fade{0%,100%{opacity:.4}50%{opacity:1}}

.card{
  background:#fff;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(15,23,42,.08);
  border:1px solid #e2e8f0;
}
.card img{
  width:100%;
  display:block;
  max-height:480px;
  object-fit:cover;
}
.card-body{padding:40px 42px 48px}
.card .date{
  font-size:11px;
  color:#4285F4;
  letter-spacing:.24em;
  font-weight:600;
  display:block;
}
.card h1{
  margin:14px 0 28px;
  font-size:24px;
  line-height:1.65;
  font-weight:700;
  color:#0f172a;
  letter-spacing:.02em;
}
.card .text{
  font-size:15px;
  line-height:2.05;
  white-space:pre-wrap;
  color:#334155;
  word-break:break-word;
}

.back-wrap{margin-top:52px;text-align:center}
.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 36px;
  border:1.5px solid #4285F4;
  color:#4285F4;
  text-decoration:none;
  border-radius:8px;
  font-size:13px;
  letter-spacing:.14em;
  font-weight:600;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.back-btn:hover{background:#4285F4;color:#ffffff}

.not-found{
  text-align:center;padding:90px 24px;
}
.not-found h1{font-size:24px;margin-bottom:18px;color:#0f172a;font-weight:700}
.not-found p{font-size:14px;color:#64748b;margin-bottom:36px;line-height:1.9}

.produced-by{
  text-align:center;
  margin-top:64px;
  font-size:10px;
  letter-spacing:.28em;
  color:rgba(15,23,42,.4);
  text-transform:uppercase;
  font-family:'Noto Serif JP',serif;
}
.produced-by a{color:rgba(66,133,244,.7);text-decoration:none;transition:color .3s ease}
.produced-by a:hover{color:#4285F4}

@media (max-width:600px){
  .wrap{margin:30px auto;padding:0 16px 60px}
  .card-body{padding:28px 22px 32px}
  .card h1{font-size:20px;margin:12px 0 22px}
  .card .text{font-size:14.5px;line-height:1.95}
  header a{font-size:14px;letter-spacing:.12em}
  .back-btn{padding:13px 28px;font-size:12px}
}
</style>
</head>
<body>

<header>
  <a href="https://search-mania.net/">
    <img src="https://res.cloudinary.com/dgs6qz3bd/image/upload/v1762307524/SearchMania%E3%83%AD%E3%82%B4_%E9%BB%92_hxaeuk.png" alt="SearchMania">
    <span>SearchMania</span>
  </a>
</header>

<div class="wrap" id="root">
  <div class="loading"></div>
</div>

<script src="./app.js" defer></script>

</body>
</html>
