<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません | SearchMania Inc.</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dgs6qz3bd/image/upload/v1762307524/SearchMania%E3%83%AD%E3%82%B4_%E9%BB%92_hxaeuk.png">
<style>
  :root { --ink:#0a0f1a; --mute:#6b7280; --blue:#1a73e8; --paper:#fafaf7; --line:rgba(10,15,26,.1); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper); color:var(--ink); font-family:"Noto Sans JP","Inter",system-ui,sans-serif; padding:24px; }
  .box { max-width:560px; text-align:center; }
  .code { font-family:"Inter",sans-serif; font-size:96px; font-weight:800; letter-spacing:-.04em; color:var(--blue); line-height:1; margin:0 0 12px; }
  h1 { font-size:22px; margin:0 0 12px; }
  p { color:var(--mute); line-height:1.9; margin:0 0 28px; font-size:15px; }
  .links { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  a.btn { display:inline-block; padding:12px 22px; border-radius:6px; font-size:14px; font-weight:700; text-decoration:none; color:#fff; background:var(--ink); }
  a.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  a.btn:hover { background:var(--blue); color:#fff; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>お探しのページが見つかりません</h1>
    <p>URL が変更されたか、ページが削除された可能性があります。<br>下記からお探しください。</p>
    <div class="links">
      <a class="btn" href="/">トップページへ</a>
      <a class="btn ghost" href="/googlemap-shukyaku/">Googleマップ集客とは</a>
      <a class="btn ghost" href="/case/">導入事例</a>
      <a class="btn ghost" href="/#contact">お問い合わせ</a>
    </div>
  </div>
</body>
</html>
