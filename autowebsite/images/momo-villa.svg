<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1A18"/>
      <stop offset="100%" stop-color="#252320"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E8232"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#B8A07A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle horizontal lines (architectural grid) -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="157" x2="1200" y2="157" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="0" y1="473" x2="1200" y2="473" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <!-- Large 百 glyph -->
  <text x="900" y="520" font-family="serif" font-size="480" font-weight="300" fill="rgba(255,255,255,0.03)" text-anchor="middle">百</text>
  <!-- Eyebrow -->
  <text x="80" y="200" font-family="'Arial', sans-serif" font-size="14" font-weight="300" fill="rgba(184,160,122,0.7)" letter-spacing="5">TINY LUXURY VILLA  ·  NANJO, OKINAWA</text>
  <!-- Accent line -->
  <line x1="80" y1="218" x2="220" y2="218" stroke="rgba(184,160,122,0.4)" stroke-width="1"/>
  <!-- Main brand -->
  <text x="80" y="350" font-family="serif" font-size="120" font-weight="300" fill="#F5F0E6" letter-spacing="2">百momo</text>
  <!-- Tagline -->
  <text x="80" y="415" font-family="serif" font-size="28" font-weight="300" fill="rgba(184,160,122,0.85)" font-style="italic" letter-spacing="3">孤独という贅沢</text>
  <!-- Domain -->
  <text x="80" y="560" font-family="'Arial', sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.25)" letter-spacing="4">momo.search-mania.net</text>
</svg>
