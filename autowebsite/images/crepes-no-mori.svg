  <!-- ── 波線アンダーライン ── -->
  <path d="M 240 330 Q 270 322, 300 330 T 360 330 T 420 330 T 480 330 T 540 330 T 600 330 T 660 330 T 720 330 T 780 330 T 840 330 T 880 330 T 900 330"
